name: Build four platform clients
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which client packages to build'
        type: choice
        default: all
        options: [all, desktop, android, ios]
permissions:
  contents: read
concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    if: github.event_name != 'workflow_dispatch' || (inputs.platform || 'all') == 'all' || inputs.platform == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-15
            command: build:mac
          - platform: Windows
            os: windows-latest
            command: build:win
    name: ${{ matrix.platform }} installers (unsigned test build)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/configure-server.mjs
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop audit --audit-level=high
      - run: npm --prefix desktop test
      - run: npm --prefix desktop run ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: Tune-Arena-${{ matrix.platform }}-test-installers
          path: |
            desktop/dist/**/*.dmg
            desktop/dist/**/*.zip
            desktop/dist/**/*.exe
          if-no-files-found: error
          retention-days: 14
  android:
    if: github.event_name != 'workflow_dispatch' || (inputs.platform || 'all') == 'all' || inputs.platform == 'android'
    name: Android debug APK and release bundle source check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android command-line tools and SDK packages
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Verify Android SDK tools
        run: sdkmanager --version
      - working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease lint
      - run: node scripts/check-projects.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: Tune-Arena-Android-debug-APK-and-unsigned-AAB
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
  ios:
    if: github.event_name != 'workflow_dispatch' || (inputs.platform || 'all') == 'all' || inputs.platform == 'ios'
    name: iOS simulator and unsigned device archive
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: xcodebuild -project ios/TuneArena.xcodeproj -scheme TuneArena -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath outputs/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project ios/TuneArena.xcodeproj -scheme TuneArena -configuration Release -destination 'generic/platform=iOS' -archivePath outputs/TuneArena.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - run: ditto -c -k --sequesterRsrc --keepParent 'outputs/ios-simulator/Build/Products/Debug-iphonesimulator/Tune Arena.app' outputs/TuneArena-iOS-Simulator.zip
      - run: ditto -c -k --sequesterRsrc --keepParent outputs/TuneArena.xcarchive outputs/TuneArena-iOS-unsigned-archive.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Tune-Arena-iOS-simulator-and-unsigned-archive
          path: outputs/*.zip
          if-no-files-found: error
          retention-days: 14
