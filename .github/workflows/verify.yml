name: Verify web and security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix web ci
      - run: npm --prefix web audit --audit-level=high
      - run: npm test
      - name: Build production Worker from the repository root
        run: npm run build:cloudflare
        env: &cloudflare-test-settings
          TUNE_D1_DATABASE_ID: '11111111-1111-4111-8111-111111111111'
          TUNE_R2_BUCKET_NAME: tune-arena-ci
          TUNE_APP_ORIGIN: https://tune-arena.invalid
          TUNE_WORKER_NAME: tune-arena-ci
      - name: Validate production Worker upload without publishing
        run: npm run deploy:cloudflare -- --dry-run
        env: *cloudflare-test-settings
      - run: npm --prefix web run db:local
      - run: npm --prefix web run db:local
      - run: node scripts/check-projects.mjs
